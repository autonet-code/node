name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_hash: ${{ steps.hash.outputs.PACKAGE_HASH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install build python-minifier

      - name: Build release (obfuscate + wheel + hash)
        run: python scripts/build_release.py

      - name: Read package hash
        id: hash
        run: echo "PACKAGE_HASH=$(cat dist/package_hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

      - name: Upload hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-hash
          path: dist/package_hash.txt

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: package-hash
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/package_hash.txt
            scripts/install.sh
            scripts/install.ps1
          body: |
            ## Install

            **pip:**
            ```bash
            pip install autonet-computer
            ```

            **Linux/macOS:**
            ```bash
            curl -sSL https://github.com/autonet-code/node/releases/latest/download/install.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://github.com/autonet-code/node/releases/latest/download/install.ps1 | iex
            ```

            **Optional extras:**
            ```bash
            pip install autonet-computer[voice]      # Voice / TTS
            pip install autonet-computer[node]       # Full training node (PyTorch)
            pip install autonet-computer[p2p]        # P2P networking
            ```

            ## Package Integrity Hash

            Publish this to the on-chain Registry to enable node self-verification:
            ```
            Key:   node.code.hash.<version>
            Value: ${{ needs.build.outputs.package_hash }}
            ```
