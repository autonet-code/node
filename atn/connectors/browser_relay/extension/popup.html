<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #121218;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .status {
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .connected {
      background: rgba(0, 184, 148, 0.12);
      border: 1px solid rgba(0, 184, 148, 0.25);
      color: #00b894;
    }
    .connected .dot { background: #00b894; }
    .disconnected {
      background: rgba(214, 48, 49, 0.12);
      border: 1px solid rgba(214, 48, 49, 0.25);
      color: #d63031;
    }
    .disconnected .dot { background: #d63031; }
    .info {
      font-size: 11px;
      color: #888;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .divider {
      height: 1px;
      background: #2d2d3a;
      margin: 12px 0;
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #666;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(108, 92, 231, 0.12);
      border: 1px solid rgba(108, 92, 231, 0.2);
      color: #a29bfe;
      font-size: 11px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .link-chip:hover {
      background: rgba(108, 92, 231, 0.22);
    }
    .link-chip svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .resource-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .resource-links a {
      font-size: 11px;
      color: #a29bfe;
      text-decoration: underline;
      text-decoration-color: rgba(162, 155, 254, 0.4);
    }
    .resource-links a:hover {
      text-decoration-color: #a29bfe;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Autonet">
    <h1>Autonet</h1>
  </div>

  <div id="status" class="status disconnected">
    <span class="dot"></span>
    <span id="status-text">Checking...</span>
  </div>
  <div class="info" id="info"></div>

  <div class="divider"></div>

  <div class="section-label">Apps</div>

  </div>

  <div class="divider"></div>

  <div class="resource-links">

</body>
</html>
