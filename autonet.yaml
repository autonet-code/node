device: auto
data_dir: ./data
log_level: INFO
# Fixed-emission economics: 100 ATN per day, split pro-rata per epoch.
epoch_emission_rate: 0.0011574074   # 100 / 86400 seconds
# Candle close: dev epochs run 2 days minimum + 1-day random-cut window
# (dev > prod duration deliberately — less activity needs longer windows).
epoch_min_seconds: 172800
epoch_candle_window_seconds: 86400
orchestrator:
  model: claude-opus-4-6
blockchain:
  rpc_url: https://node.shadownet.etherlink.com
  chain_id: 127823
  contracts:
    ATNToken: '0x6e82D6678790820Ef81669046e921b1D2947A08f'
    ParticipantStaking: '0x8B08279cf510BfeB6acE6BA5282BF0e4F6eBD8EE'
    ModelShardRegistry: '0x7De3B8a6bc4eB7f098018Da030f93718eeaf7885'
    TaskContract: '0x8fEb5be0367F596bC6357538e346472eBf76D365'
    ResultsRewards: '0x1ef4e0A6DaC1CFD23E31427b2Ecdd2A6A0F0f542'
    AnchorBridge: '0x2005556109607F5b11BaCAd05270E7DE32260B4D'
    DisputeManager: '0xB1Cf18A50bA3fffD578D2b2B08Ea2D03A8Aa2a3b'
    AutonetDAO: '0xD5691B7c37a472D84D4E3b8d89CEb79a675dd36e'
    ForcedErrorRegistry: '0x290Fc505782E6b70A4c57A3cECc6Ad109466520e'
    InferenceProviderFactory: '0xf8246D4E4668EaC14aA508Daa02EFb60099699BF'
    Autonet: '0x97EB727426f593B2E2bC64F1604b5E7fE2eF676b'
blob_store:
  data_dir: ~/.autonet/blobs
  peer_urls: []
  server_port: 9100
model:
  architecture: jepa
  image_size: 32
  patch_size: 4
  embed_dim: 192
  num_heads: 3
  encoder_depth: 6
  predictor_depth: 3
  predictor_embed_dim: 96
training:
  epochs: 2
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.05
  num_samples: 500
  optimizer: adamw
  task_type: jepa
staking:
  proposer: 100
  solver: 50
  coordinator: 500
  aggregator: 1000
node:
  max_cycles: 0          # 0 = run forever (10 was a sim-era leftover that
                         # silently stopped the service loop after 30s)
  cycle_delay: 30.0
  task_mode: ground_truth
  aggregation_method: fedavg
  trim_ratio: 0.2
  min_updates_for_aggregation: 2
p2p:
  listen_port: 0
  listen_host: 0.0.0.0
  bootstrap_peers: []
  enable_quic: false
  enable_upnp: false
  capability_advertise_interval: 60
  ping_interval: 30
guild:
  auto_join: false
  module_ids: []
  aggregation_level: flat
  min_guild_updates: 2
  reputation_weight: 0.3
  member_count_weight: 0.7
sponsor_agent:
  enabled: false
  register_as_sponsor: false
  training_charter: ""
  module_ids: []
  min_alignment_threshold: 0.5
rpb:
  jurisdiction_id: "autonet"
  agent_registry_address: ""
capture:
  enabled_sources: []
  fps_cap: 2
  resolution:
  - 224
  - 224
  screen_monitor: 1
  browser_scrub_pii: true
  browser_exclude_patterns: []
privacy:
  exclude_apps: []
  blur_regions: []
  scrub_pii: false
resources:
  max_cpu_percent: 80.0
  max_memory_mb: 4096
  active_hours_start: 0
  active_hours_end: 24
  check_interval: 10.0
update:
  check_interval: 3600
  update_source: git
  update_url: ''
  auto_apply: false
