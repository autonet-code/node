[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonet-computer"
version = "0.1.1"
description = "Decentralized AI alignment network with agent orchestration framework"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    {name = "ATN Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ATN core (agent framework)
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "websockets>=13.0",
    # Autonet core (network layer)
    "web3>=6.0.0",
    "eth-account>=0.10.0",
    "eth-utils>=2.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "mss>=9.0.0",
]

[project.urls]
Homepage = "https://autonet.computer"
Repository = "https://github.com/autonet-code/node"
Issues = "https://github.com/autonet-code/node/issues"

[project.optional-dependencies]
# P2P networking (for decentralized training)
p2p = [
    "libp2p>=0.6.0",
    "trio>=0.22.0",
    "miniupnpc>=2.0",
]
# Full node: training loop, JEPA models, consensus verification
node = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]
# Core voice: TTS output + audio mixing
voice = [
    "numpy>=1.24",
    "sounddevice>=0.4",
]
# Individual TTS backends
voice-kokoro = ["autonet[voice]", "kokoro-onnx>=0.4"]
voice-edge   = ["autonet[voice]", "edge-tts>=6.0", "miniaudio>=1.5"]
voice-11labs = ["autonet[voice]", "requests>=2.28"]
# Push-to-talk: STT input via hotkey recording + Whisper transcription
voice-ptt = ["autonet[voice]", "keyboard>=0.13", "faster-whisper>=1.0"]
# Everything voice-related
voice-full = [
    "autonet[voice]",
    "autonet[voice-kokoro]",
    "autonet[voice-edge]",
    "autonet[voice-ptt]",
]
# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
atn = "atn.cli:main"

[tool.setuptools.packages.find]
include = ["atn*", "nodes*"]

[tool.setuptools.package-data]
"atn.connectors" = ["*/connector.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
