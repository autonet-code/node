version: '3.8'

services:
  # Local Ethereum node for development
  hardhat:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8545:8545"
    command: npx hardhat node --hostname 0.0.0.0
    networks:
      - autonet

  # Proposer node
  proposer:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      - NODE_ROLE=proposer
      - CHAIN_RPC_URL=http://hardhat:8545
      - BLOB_DATA_DIR=/data/blobs
      - BLOB_HTTP_PORT=9100
      - PEER_URLS=http://solver:9100,http://coordinator:9100,http://aggregator:9100,http://inference:9100
    depends_on:
      - hardhat
    volumes:
      - blob_data:/data/blobs
    networks:
      - autonet

  # Solver node
  solver:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      - NODE_ROLE=solver
      - CHAIN_RPC_URL=http://hardhat:8545
      - BLOB_DATA_DIR=/data/blobs
      - BLOB_HTTP_PORT=9100
      - PEER_URLS=http://proposer:9100,http://coordinator:9100,http://aggregator:9100,http://inference:9100
    depends_on:
      - hardhat
    volumes:
      - blob_data:/data/blobs
    networks:
      - autonet

  # Coordinator node
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      - NODE_ROLE=coordinator
      - CHAIN_RPC_URL=http://hardhat:8545
      - BLOB_DATA_DIR=/data/blobs
      - BLOB_HTTP_PORT=9100
      - PEER_URLS=http://proposer:9100,http://solver:9100,http://aggregator:9100,http://inference:9100
    depends_on:
      - hardhat
    volumes:
      - blob_data:/data/blobs
    networks:
      - autonet

  # Aggregator node
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      - NODE_ROLE=aggregator
      - CHAIN_RPC_URL=http://hardhat:8545
      - BLOB_DATA_DIR=/data/blobs
      - BLOB_HTTP_PORT=9100
      - PEER_URLS=http://proposer:9100,http://solver:9100,http://coordinator:9100,http://inference:9100
    depends_on:
      - hardhat
    volumes:
      - blob_data:/data/blobs
    networks:
      - autonet

  # Inference node
  inference:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      - NODE_ROLE=inference
      - CHAIN_RPC_URL=http://hardhat:8545
      - BLOB_DATA_DIR=/data/blobs
      - BLOB_HTTP_PORT=9100
      - PEER_URLS=http://proposer:9100,http://solver:9100,http://coordinator:9100,http://aggregator:9100
    depends_on:
      - hardhat
    volumes:
      - blob_data:/data/blobs
    ports:
      - "9100:9100"
    networks:
      - autonet

volumes:
  blob_data:

networks:
  autonet:
    driver: bridge
